<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA Trip 2026 – Interactive Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 150px);
        }

        .header {
            grid-column: 1 / -1;
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1em;
            border: 2px solid white;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-5px);
        }

        .map-panel {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }

        .itinerary-panel {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .itinerary-header {
            background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%);
            color: white;
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .itinerary-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .day-group {
            margin-bottom: 20px;
            border-left: 4px solid #fc4a1a;
            padding-left: 15px;
        }

        .day-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .day-badge {
            background: #fc4a1a;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            min-width: 60px;
            text-align: center;
        }

        .location-item {
            background: #f9f9f9;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .location-item:hover {
            background: #f0f0f0;
            border-left-color: #fc4a1a;
            transform: translateX(5px);
        }

        .location-item.active {
            background: #fc4a1a;
            color: white;
            border-left-color: #d93a0d;
        }

        .location-item-time {
            font-size: 0.85em;
            opacity: 0.7;
            margin-bottom: 3px;
        }

        .location-item-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .location-item-desc {
            font-size: 0.85em;
            line-height: 1.4;
            opacity: 0.8;
        }

        .location-item.active .location-item-time,
        .location-item.active .location-item-desc {
            opacity: 0.9;
        }

        .type-event      { border-top-color: #FF85A1; }
        .type-attraction { border-top-color: #FF6B6B; }
        .type-hotel      { border-top-color: #4ECDC4; }
        .type-restaurant { border-top-color: #A569BD; }
        .type-landmark   { border-top-color: #80CAFF; }
        .type-airport    { border-top-color: #90EE90; }
        .type-transit    { border-top-color: #C0C0C0; }

        .legend {
            padding: 15px;
            background: #f5f5f5;
            border-top: 1px solid #ddd;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.85em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        .leaflet-popup-content {
            margin: 0;
            font-size: 0.95em;
        }

        .popup-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .popup-content {
            color: #666;
            line-height: 1.5;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .map-panel    { height: 400px; }
            .itinerary-panel { height: 500px; }
        }

        .filter-controls {
            padding: 15px;
            background: #f9f9f9;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-label {
            font-weight: bold;
            font-size: 0.9em;
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            background: white;
        }

        .filter-select:focus {
            outline: none;
            border-color: #fc4a1a;
            box-shadow: 0 0 0 2px rgba(252, 74, 26, 0.15);
        }

        .itinerary-list::-webkit-scrollbar       { width: 8px; }
        .itinerary-list::-webkit-scrollbar-track  { background: #f1f1f1; }
        .itinerary-list::-webkit-scrollbar-thumb  { background: #fc4a1a; border-radius: 4px; }
        .itinerary-list::-webkit-scrollbar-thumb:hover { background: #d93a0d; }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h1>🗺️ Los Angeles Trip 2026 – Interactive Map</h1>
            <a href="../" class="back-btn">← Back</a>
        </div>
        <p>May 15–17, 2026 | 3-Day Itinerary · ZIPANGU Festival</p>
    </div>

    <div class="container">
        <div class="map-panel">
            <div id="map"></div>
        </div>

        <div class="itinerary-panel">
            <div class="filter-controls">
                <label class="filter-label">Filter by Day:</label>
                <select id="dayFilter" class="filter-select">
                    <option value="">All Days</option>
                </select>
            </div>

            <div class="itinerary-header">
                Itinerary – Click a location to jump on the map
            </div>

            <div class="itinerary-list" id="itinerary"></div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #FF85A1;"></div>
                    <span>Event</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #FF6B6B;"></div>
                    <span>Attraction</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4ECDC4;"></div>
                    <span>Hotel</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #A569BD;"></div>
                    <span>Restaurant</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #80CAFF;"></div>
                    <span>Landmark</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #90EE90;"></div>
                    <span>Airport</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map;
        let markers = {};
        let allData = {};
        let currentMarkers = [];

        const typeColors = {
            'event':      '#FF85A1',
            'attraction': '#FF6B6B',
            'hotel':      '#4ECDC4',
            'restaurant': '#A569BD',
            'landmark':   '#80CAFF',
            'airport':    '#90EE90',
            'transit':    '#C0C0C0'
        };

        // ── Map init ─────────────────────────────────────────────────
        function initMap() {
            map = L.map('map').setView([34.05, -118.28], 10);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
                maxZoom: 19,
                minZoom: 6
            }).addTo(map);
        }

        // ── Data loading ─────────────────────────────────────────────
        async function loadData() {
            const res  = await fetch('data.json?v=1.1');
            const data = await res.json();
            allData = data;

            const dayFilter = document.getElementById('dayFilter');
            data.days.forEach(day => {
                const option = document.createElement('option');
                option.value = day.date;
                option.textContent = `${formatDate(day.date)} – ${day.title}`;
                dayFilter.appendChild(option);
            });

            renderItinerary(data.days);
            addAllMarkers(data.days);
        }

        // ── Date formatting ──────────────────────────────────────────
        function formatDate(dateStr) {
            const date     = new Date(dateStr + 'T00:00:00');
            const month    = String(date.getMonth() + 1).padStart(2, '0');
            const day      = String(date.getDate()).padStart(2, '0');
            const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            return `${month}/${day} (${weekdays[date.getDay()]})`;
        }

        // ── Itinerary render ─────────────────────────────────────────
        function renderItinerary(days, filterDate = '') {
            const itinerary = document.getElementById('itinerary');
            itinerary.innerHTML = '';

            const filteredDays = filterDate
                ? days.filter(d => d.date === filterDate)
                : days;

            filteredDays.forEach(day => {
                const dayGroup = document.createElement('div');
                dayGroup.className = 'day-group';

                const dayTitleEl = document.createElement('div');
                dayTitleEl.className = 'day-title';
                dayTitleEl.innerHTML = `
                    <span class="day-badge">${day.day}</span>
                    <span>${formatDate(day.date)} ${day.title}</span>
                `;
                dayGroup.appendChild(dayTitleEl);

                day.locations.forEach(location => {
                    const item = document.createElement('div');
                    item.className = `location-item type-${location.type}`;
                    item.dataset.locationId = location.id;
                    item.innerHTML = `
                        <div class="location-item-time">⏰ ${location.time}</div>
                        <div class="location-item-name">${location.name}</div>
                        <div class="location-item-desc">${location.description}</div>
                        ${location.price ? `<div class="location-item-time">💰 ${location.price}</div>` : ''}
                    `;
                    item.addEventListener('click', () => focusLocation(location.id));
                    dayGroup.appendChild(item);
                });

                itinerary.appendChild(dayGroup);
            });
        }

        // ── Markers ──────────────────────────────────────────────────
        function addAllMarkers(days) {
            days.forEach(day => {
                day.locations.forEach(location => {
                    const color = typeColors[location.type] || '#666';

                    const icon = L.divIcon({
                        className: 'custom-marker',
                        html: `<div style="background-color:${color};width:24px;height:24px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:white;box-shadow:0 2px 8px rgba(0,0,0,0.3);">${location.id.substring(0,1).toUpperCase()}</div>`,
                        iconSize:   [30, 30],
                        iconAnchor: [15, 15]
                    });

                    const marker = L.marker([location.lat, location.lng], { icon })
                        .bindPopup(`<div style="font-family:sans-serif;min-width:260px;">
                            <div class="popup-title">${location.name}</div>
                            <div class="popup-content">
                                <p><strong>⏰ Time:</strong> ${location.time}</p>
                                <p><strong>📍 Info:</strong> ${location.description}</p>
                                ${location.price ? `<p><strong>💰 Cost:</strong> ${location.price}</p>` : ''}
                                <p><strong>📅 Date:</strong> ${day.date}</p>
                            </div>
                        </div>`)
                        .addTo(map);

                    markers[location.id] = { marker, location, dayDate: day.date };
                });
            });
        }

        // ── Focus location ───────────────────────────────────────────
        function focusLocation(locationId) {
            document.querySelectorAll('.location-item.active').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`[data-location-id="${locationId}"]`).forEach(item => item.classList.add('active'));

            if (markers[locationId]) {
                const { marker, location } = markers[locationId];
                map.setView([location.lat, location.lng], 14);
                marker.openPopup();
                const item = document.querySelector(`[data-location-id="${locationId}"]`);
                if (item) item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // ── Day filter ───────────────────────────────────────────────
        document.getElementById('dayFilter').addEventListener('change', (e) => {
            const filterDate = e.target.value;
            renderItinerary(allData.days, filterDate);

            Object.keys(markers).forEach(id => {
                const { marker, dayDate } = markers[id];
                if (filterDate === '') {
                    marker.setOpacity(1);
                } else if (dayDate === filterDate) {
                    marker.setOpacity(1);
                    const firstLoc = allData.days.find(d => d.date === filterDate)?.locations[0];
                    if (firstLoc) map.setView([firstLoc.lat, firstLoc.lng], 12);
                } else {
                    marker.setOpacity(0.3);
                }
            });

            currentMarkers = filterDate
                ? Object.entries(markers)
                    .filter(([_, { dayDate }]) => dayDate === filterDate)
                    .map(([id]) => id)
                : [];
        });

        // ── Boot ─────────────────────────────────────────────────────
        initMap();
        loadData();
    </script>
</body>
</html>
